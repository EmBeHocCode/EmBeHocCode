<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="t d"><title id="t">Project garden</title><desc id="d">Three animated editorial project categories.</desc><defs><linearGradient id="g"><stop stop-color="#FF4D8D"/><stop offset=".55" stop-color="#FF8FC7"/><stop offset="1" stop-color="#CFA7FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.card{animation:card 4s ease-in-out infinite}.b{animation-delay:-1.3s}.c{animation-delay:-2.6s}.bud{animation:bud 2s ease-in-out infinite}@keyframes card{0%,100%{opacity:.68}50%{opacity:1}}@keyframes bud{0%,100%{r:3;opacity:.35}50%{r:6;opacity:1}}@media(prefers-reduced-motion:reduce){.card,.bud{animation:none!important}}</style></defs><rect width="1200" height="170" rx="22" fill="#120A14"/><g fill="#1D101C" stroke="url(#g)"><path class="card" d="M30 28H374L394 48V142H30Z"/><path class="card b" d="M428 28H772L792 48V142H428Z"/><path class="card c" d="M826 28H1170V142H806V48Z"/></g><g fill="#FFF5FA" font-family="Georgia,serif" font-size="25" font-style="italic"><text x="64" y="79">Commerce systems</text><text x="462" y="79">AI experiments</text><text x="840" y="79">Playful software</text></g><g fill="#C6A7B9" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1"><text x="64" y="108">PRODUCTS · FLOWS · OPERATIONS</text><text x="462" y="108">AUTOMATION · ASSISTANTS · DATA</text><text x="840" y="108">GAMES · UTILITIES · VISUALS</text></g><g fill="#FF8FC7" filter="url(#glow)"><circle class="bud" cx="64" cy="49" r="4"/><circle class="bud" cx="462" cy="49" r="4"/><circle class="bud" cx="840" cy="49" r="4"/></g></svg>
