<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Mieow Neon Sakura</title><desc id="desc">An animated editorial profile banner inspired by neon cherry blossoms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100814"/><stop offset=".5" stop-color="#24101F"/><stop offset="1" stop-color="#0B0912"/></linearGradient>
    <radialGradient id="moon"><stop stop-color="#FFEAF5"/><stop offset=".58" stop-color="#FF9ACA"/><stop offset="1" stop-color="#FF4D9D" stop-opacity=".08"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF4D8D"/><stop offset=".52" stop-color="#FF8FC7"/><stop offset="1" stop-color="#CFA7FF"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .petal-a{animation:fall-a 7s ease-in-out infinite}.petal-b{animation:fall-b 9s ease-in-out infinite}.petal-c{animation:fall-c 6s ease-in-out infinite}.moon{animation:moon 4s ease-in-out infinite}.branch{animation:draw 6s ease-in-out infinite}.word{animation:word 4.5s ease-in-out infinite}
      @keyframes fall-a{0%,100%{transform:translate(0,-12px) rotate(0);opacity:.25}50%{transform:translate(28px,22px) rotate(100deg);opacity:1}} @keyframes fall-b{0%,100%{transform:translate(0,-8px) rotate(20deg);opacity:.4}50%{transform:translate(-24px,28px) rotate(-90deg);opacity:1}} @keyframes fall-c{0%,100%{transform:translate(0,0) rotate(0);opacity:.3}50%{transform:translate(12px,18px) rotate(70deg);opacity:.9}} @keyframes moon{0%,100%{opacity:.72}50%{opacity:1}} @keyframes draw{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:-80}} @keyframes word{0%,100%{opacity:.9}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.petal-a,.petal-b,.petal-c,.moon,.branch,.word{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <circle class="moon" cx="982" cy="132" r="92" fill="url(#moon)" filter="url(#glow)"/><circle cx="982" cy="132" r="70" fill="#1B0D19" fill-opacity=".18"/>
  <path d="M0 258C174 225 258 133 361 95C447 64 492 34 520 0" fill="none" stroke="#351526" stroke-width="20" stroke-linecap="round"/>
  <path class="branch" d="M0 258C174 225 258 133 361 95C447 64 492 34 520 0M208 171C170 126 142 109 102 96M335 104C309 60 283 42 251 29" fill="none" stroke="url(#ink)" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 9" filter="url(#glow)"/>
  <g fill="#FF8FC7" filter="url(#glow)"><ellipse class="petal-a" cx="120" cy="74" rx="7" ry="3" transform="rotate(-24 120 74)"/><ellipse class="petal-b" cx="279" cy="45" rx="8" ry="3"/><ellipse class="petal-c" cx="468" cy="65" rx="7" ry="3"/><ellipse class="petal-a" cx="760" cy="68" rx="6" ry="3"/><ellipse class="petal-b" cx="1088" cy="218" rx="8" ry="3"/></g>
  <g class="word"><text x="590" y="135" text-anchor="middle" fill="#FFF5FA" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-style="italic" font-weight="700" letter-spacing="4">Mieow</text><text x="590" y="174" text-anchor="middle" fill="#FF8FC7" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="5">DIGITAL BLOOM · COMMERCE · AI</text></g>
  <path d="M420 201H760" stroke="url(#ink)" stroke-width="1.5"/><circle cx="590" cy="201" r="4" fill="#FFEAF5" filter="url(#glow)"/>
  <text x="42" y="42" fill="#CFA7FF" font-family="Consolas, monospace" font-size="11" letter-spacing="2">COLLECTION // SAKURA_02</text>
  <text x="1155" y="269" text-anchor="end" fill="#FF8FC7" font-family="Consolas, monospace" font-size="10" letter-spacing="2">GROW THROUGH SHIPPING</text>
</svg>
