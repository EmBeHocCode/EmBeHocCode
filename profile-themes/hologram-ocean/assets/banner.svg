<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Mieow Hologram Ocean</title><desc id="d">An animated oceanic hologram dashboard banner.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#031622"/><stop offset=".5" stop-color="#07304A"/><stop offset="1" stop-color="#04121D"/></linearGradient><linearGradient id="a"><stop stop-color="#32E6D2"/><stop offset=".5" stop-color="#36A8FF"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient><radialGradient id="sonar"><stop stop-color="#32E6D2" stop-opacity=".25"/><stop offset=".7" stop-color="#36A8FF" stop-opacity=".08"/><stop offset="1" stop-color="#36A8FF" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#32E6D2" stroke-opacity=".07"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.ring{transform-origin:948px 145px;animation:ring 5s ease-in-out infinite}.r2{animation-delay:-1.7s}.r3{animation-delay:-3.4s}.wave{animation:wave 4s linear infinite}.bubble{animation:bubble 5s ease-in-out infinite}.b2{animation-delay:-2s}.b3{animation-delay:-3.5s}.scan{animation:scan 6s ease-in-out infinite}@keyframes ring{0%,100%{transform:scale(.72);opacity:.15}50%{transform:scale(1.05);opacity:.8}}@keyframes wave{to{stroke-dashoffset:-120}}@keyframes bubble{0%,100%{transform:translateY(12px);opacity:.2}50%{transform:translateY(-18px);opacity:1}}@keyframes scan{0%,10%{transform:translateX(-180px);opacity:0}25%,70%{opacity:1}90%,100%{transform:translateX(1380px);opacity:0}}@media(prefers-reduced-motion:reduce){.ring,.wave,.bubble,.scan{animation:none!important}}</style></defs><rect width="1200" height="300" rx="26" fill="url(#bg)"/><rect width="1200" height="300" rx="26" fill="url(#grid)"/><rect class="scan" width="160" height="300" fill="url(#sonar)" opacity=".22"/><circle cx="948" cy="145" r="118" fill="url(#sonar)"/><g fill="none" stroke="#32E6D2" filter="url(#glow)"><circle class="ring" cx="948" cy="145" r="42"/><circle class="ring r2" cx="948" cy="145" r="70"/><circle class="ring r3" cx="948" cy="145" r="98"/></g><path class="wave" d="M0 240C150 190 278 276 422 225C578 170 690 264 842 220C980 181 1083 241 1200 210" fill="none" stroke="url(#a)" stroke-width="3" stroke-dasharray="36 12 5 12" filter="url(#glow)"/><text x="70" y="104" fill="#8FEFE4" font-family="Consolas,monospace" font-size="12" letter-spacing="4">NODE 07 // CREATIVE DEPTH</text><text x="66" y="165" fill="#F2FCFF" font-family="Bahnschrift,Segoe UI,sans-serif" font-size="64" font-weight="700" letter-spacing="2">MIEOW</text><text x="70" y="202" fill="#66C7FF" font-family="Consolas,monospace" font-size="15" letter-spacing="3">PRODUCTS BELOW THE SURFACE</text><g fill="#32E6D2" filter="url(#glow)"><circle class="bubble" cx="730" cy="70" r="4"/><circle class="bubble b2" cx="820" cy="205" r="3"/><circle class="bubble b3" cx="1086" cy="72" r="5"/></g><text x="1144" y="270" text-anchor="end" fill="#8FEFE4" font-family="Consolas,monospace" font-size="10" letter-spacing="2">SONAR ONLINE // SIGNAL 100%</text></svg>
