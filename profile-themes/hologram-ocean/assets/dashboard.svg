<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="t d"><title id="t">Ocean system dashboard</title><desc id="d">Three oceanic glass status panels.</desc><defs><linearGradient id="g"><stop stop-color="#32E6D2"/><stop offset=".5" stop-color="#36A8FF"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.flow{animation:flow 2.8s linear infinite}.dot{animation:pulse 1.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-72}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.dot{animation:none!important}}</style></defs><rect width="1200" height="180" rx="22" fill="#041722"/><g fill="#08293A" fill-opacity=".78" stroke="#236985"><path d="M30 25H375L395 45V155H30Z"/><path d="M428 25H773L793 45V155H428Z"/><path d="M826 25H1170V155H806V45Z"/></g><path class="flow" d="M30 25H375L395 45M428 25H773L793 45M826 25H1170" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-dasharray="14 10"/><g fill="#F2FCFF" font-family="Bahnschrift,Segoe UI,sans-serif" font-size="23" font-weight="600"><text x="64" y="75">Commerce systems</text><text x="462" y="75">AI workflows</text><text x="840" y="75">Web products</text></g><g fill="#8AC5D8" font-family="Consolas,monospace" font-size="11" letter-spacing="1.4"><text x="64" y="108">DEPTH // PRODUCTION</text><text x="462" y="108">DEPTH // EXPLORATION</text><text x="840" y="108">DEPTH // SHIPPING</text></g><g fill="#32E6D2" filter="url(#glow)"><circle class="dot" cx="64" cy="130" r="4"/><circle class="dot" cx="462" cy="130" r="4"/><circle class="dot" cx="840" cy="130" r="4"/></g><g fill="#8FEFE4" font-family="Consolas,monospace" font-size="10"><text x="78" y="134">ONLINE</text><text x="476" y="134">ACTIVE</text><text x="854" y="134">READY</text></g></svg>
