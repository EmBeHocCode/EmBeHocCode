<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 94" role="img" aria-labelledby="title desc">
  <title id="title">Rotating Typewriter Subtitle</title>
  <desc id="desc">Typing animation that rotates between three profile lines.</desc>

  <defs>
    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clipLine1">
      <rect x="140" y="18" width="0" height="56">
        <animate attributeName="width" dur="15s" repeatCount="indefinite"
          values="0;1120;1120;0;0"
          keyTimes="0;0.133;0.267;0.333;1"/>
      </rect>
    </clipPath>

    <clipPath id="clipLine2">
      <rect x="140" y="18" width="0" height="56">
        <animate attributeName="width" dur="15s" repeatCount="indefinite"
          values="0;0;1120;1120;0;0"
          keyTimes="0;0.333;0.467;0.600;0.667;1"/>
      </rect>
    </clipPath>

    <clipPath id="clipLine3">
      <rect x="140" y="18" width="0" height="56">
        <animate attributeName="width" dur="15s" repeatCount="indefinite"
          values="0;0;1120;1120;0"
          keyTimes="0;0.667;0.800;0.933;1"/>
      </rect>
    </clipPath>
  </defs>

  <g font-family="Consolas, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" filter="url(#softGlow)">
    <text x="140" y="62" fill="#38bdf8" clip-path="url(#clipLine1)">
      E-Commerce Student | Software Engineering
      <animate attributeName="fill" values="#38bdf8;#60a5fa;#a78bfa;#34d399;#38bdf8" dur="6s" repeatCount="indefinite"/>
    </text>

    <text x="140" y="62" fill="#22d3ee" clip-path="url(#clipLine2)">
      Building software for real business needs
      <animate attributeName="fill" values="#22d3ee;#38bdf8;#c4b5fd;#86efac;#22d3ee" dur="6s" begin="0.8s" repeatCount="indefinite"/>
    </text>

    <text x="140" y="62" fill="#a78bfa" clip-path="url(#clipLine3)">
      Learning every day, shipping step by step
      <animate attributeName="fill" values="#a78bfa;#f472b6;#60a5fa;#22d3ee;#a78bfa" dur="6s" begin="1.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <line y1="20" y2="70" stroke="#dbeafe" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <animate attributeName="x1" dur="15s" repeatCount="indefinite"
      values="140;1260;1260;140;140;1260;1260;140;140;1260;1260;140"
      keyTimes="0;0.133;0.267;0.333;0.334;0.467;0.600;0.667;0.668;0.800;0.933;1"/>
    <animate attributeName="x2" dur="15s" repeatCount="indefinite"
      values="140;1260;1260;140;140;1260;1260;140;140;1260;1260;140"
      keyTimes="0;0.133;0.267;0.333;0.334;0.467;0.600;0.667;0.668;0.800;0.933;1"/>
    <animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="1;0.2;1"/>
  </line>
</svg>
