<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 94" role="img" aria-labelledby="title desc">
  <title id="title">Rotating Subtitle</title>
  <desc id="desc">Color-changing subtitle with rotating lines.</desc>

  <defs>
    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g font-family="Consolas, Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="middle" filter="url(#softGlow)">
    <text x="700" y="62" fill="#38bdf8" opacity="0">
      E-Commerce Student | Software Engineering
      <animate attributeName="fill" values="#38bdf8;#60a5fa;#a78bfa;#34d399;#38bdf8" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.34;0.66;0.94;0.99;1"/>
    </text>

    <text x="700" y="62" fill="#22d3ee" opacity="0">
      Building software for real business needs
      <animate attributeName="fill" values="#22d3ee;#38bdf8;#c4b5fd;#86efac;#22d3ee" dur="8s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0;0" keyTimes="0;0.30;0.36;0.61;0.67;0.99;1"/>
    </text>

    <text x="700" y="62" fill="#a78bfa" opacity="0">
      Learning every day, shipping step by step
      <animate attributeName="fill" values="#a78bfa;#f472b6;#60a5fa;#22d3ee;#a78bfa" dur="8s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;0;0;1;1;0" keyTimes="0;0.58;0.64;0.66;0.72;0.97;1"/>
    </text>
  </g>
</svg>
