<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Fun Coding Card</title>
  <desc id="desc">Animated local fun card for profile README.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1028"/>
      <stop offset="100%" stop-color="#2a183b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="240" fill="url(#bg)" rx="18"/>
  <rect x="40" y="40" width="1120" height="4" fill="url(#line)" rx="2"/>

  <text x="600" y="92" text-anchor="middle" font-size="38" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#fdf2f8" filter="url(#glow)">
    Just For Fun
    <animate attributeName="fill" values="#fdf2f8;#f9a8d4;#c084fc;#fdf2f8" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="142" text-anchor="middle" font-size="28" font-family="Consolas, Segoe UI, monospace" fill="#fbcfe8">
    Debugging: where you remove one bug and summon two more.
    <animate attributeName="opacity" values="1;0.7;1" dur="2.8s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="182" text-anchor="middle" font-size="24" font-family="Consolas, Segoe UI, monospace" fill="#f9a8d4">
    Keep calm, read logs, and commit often.
    <animate attributeName="fill" values="#f9a8d4;#f472b6;#c084fc;#f9a8d4" dur="3.2s" repeatCount="indefinite"/>
  </text>
</svg>
