<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Learning Roadmap Diagram</title>
  <desc id="desc">A pink cyber roadmap for E-Commerce and AI execution.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1026"/>
      <stop offset="100%" stop-color="#13091c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f472b6"/>
    </marker>
  </defs>

  <rect x="24" y="20" width="1152" height="430" rx="28" fill="#0d0814" stroke="#362042" stroke-width="2"/>
  <rect x="56" y="42" width="1088" height="24" rx="12" fill="#160b21"/>
  <circle cx="94" cy="54" r="5" fill="#f472b6"/>
  <circle cx="114" cy="54" r="5" fill="#fb7185"/>
  <circle cx="134" cy="54" r="5" fill="#c084fc"/>

  <text x="600" y="105" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" fill="#fdf2f8" filter="url(#glow)">
    Commerce + AI Roadmap
  </text>
  <text x="600" y="136" text-anchor="middle" font-family="Consolas, Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="1.5" fill="#f9a8d4">
    FROM BUSINESS THINKING TO REAL PRODUCT EXECUTION
  </text>

  <g stroke="url(#accent)" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity="0.95">
    <path d="M 310 190 H 520"/>
    <path d="M 680 190 H 890"/>
    <path d="M 1000 220 V 300 H 890"/>
    <path d="M 680 300 H 520"/>
    <path d="M 310 300 H 200"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(90 150)">
      <rect width="220" height="80" rx="18" fill="url(#panel)" stroke="#f472b6"/>
      <text x="24" y="28" font-size="14" fill="#f9a8d4">STAGE 01</text>
      <text x="24" y="52" font-size="24" font-weight="700" fill="#fdf2f8">Business Mindset</text>
      <text x="24" y="70" font-size="13" fill="#fbcfe8">E-Commerce first</text>
    </g>

    <g transform="translate(460 150)">
      <rect width="220" height="80" rx="18" fill="url(#panel)" stroke="#ec4899"/>
      <text x="24" y="28" font-size="14" fill="#f9a8d4">STAGE 02</text>
      <text x="24" y="52" font-size="24" font-weight="700" fill="#fdf2f8">Product Planning</text>
      <text x="24" y="70" font-size="13" fill="#fbcfe8">Analysis and structure</text>
    </g>

    <g transform="translate(830 150)">
      <rect width="220" height="80" rx="18" fill="url(#panel)" stroke="#c084fc"/>
      <text x="24" y="28" font-size="14" fill="#f9a8d4">STAGE 03</text>
      <text x="24" y="52" font-size="24" font-weight="700" fill="#fdf2f8">Commerce UX</text>
      <text x="24" y="70" font-size="13" fill="#fbcfe8">Flow and customer experience</text>
    </g>

    <g transform="translate(830 260)">
      <rect width="220" height="80" rx="18" fill="url(#panel)" stroke="#f472b6"/>
      <text x="24" y="28" font-size="14" fill="#f9a8d4">STAGE 04</text>
      <text x="24" y="52" font-size="24" font-weight="700" fill="#fdf2f8">AI Automation</text>
      <text x="24" y="70" font-size="13" fill="#fbcfe8">Smarter commerce operations</text>
    </g>

    <g transform="translate(460 260)">
      <rect width="220" height="80" rx="18" fill="url(#panel)" stroke="#ec4899"/>
      <text x="24" y="28" font-size="14" fill="#f9a8d4">STAGE 05</text>
      <text x="24" y="52" font-size="24" font-weight="700" fill="#fdf2f8">Data Iteration</text>
      <text x="24" y="70" font-size="13" fill="#fbcfe8">Experiments and optimization</text>
    </g>

    <g transform="translate(90 260)">
      <rect width="220" height="80" rx="18" fill="url(#panel)" stroke="#c084fc"/>
      <text x="24" y="28" font-size="14" fill="#f9a8d4">STAGE 06</text>
      <text x="24" y="52" font-size="24" font-weight="700" fill="#fdf2f8">Scalable Value</text>
      <text x="24" y="70" font-size="13" fill="#fbcfe8">Ship measurable outcomes</text>
    </g>
  </g>
</svg>
