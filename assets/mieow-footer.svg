  <text x="600" y="99" text-anchor="middle" fill="#F8FAFC" fill-opacity="0.74" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="2">BUILD  ·  LEARN  ·  SHIP</text>
  <circle cx="402" cy="73" r="4" fill="#EF4444" />
  <circle cx="798" cy="73" r="4" fill="#34EACB">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <path d="M575 119H625" stroke="#FF0066" stroke-width="3" stroke-linecap="round" />
