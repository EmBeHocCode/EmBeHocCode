<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="158" viewBox="0 0 1200 158" role="img" aria-labelledby="title desc">
  <title id="title">Animated Mieow profile footer</title>
  <desc id="desc">A cyber footer with flowing red and pink waves, teal signal lights, and animated data rails.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF4444" /><stop offset="0.55" stop-color="#FF0066" /><stop offset="0.9" stop-color="#FF0066" /><stop offset="0.96" stop-color="#8B5CF6" /><stop offset="1" stop-color="#34EACB" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34EACB" stop-opacity="0"/><stop offset=".5" stop-color="#34EACB" stop-opacity=".18"/><stop offset="1" stop-color="#34EACB" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#34EACB" stroke-opacity=".045"/></pattern>
    <filter id="softGlow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .wave-flow { animation: wave-flow 3.2s linear infinite; }.rail { animation: rail 2.6s linear infinite; }.scan { animation: scan 5.8s ease-in-out infinite; }.dot { animation: pulse 1.7s ease-in-out infinite; }.dot.alt { animation-delay: -.85s; }.brand { animation: brand 3s ease-in-out infinite; }.caret { animation: caret 1s steps(2, end) infinite; }
      @keyframes wave-flow { to { stroke-dashoffset: -96; } } @keyframes rail { to { stroke-dashoffset: -58; } }
      @keyframes scan { 0%, 10% { transform: translateX(-220px); opacity: 0; } 22%, 74% { opacity: 1; } 90%, 100% { transform: translateX(1420px); opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } } @keyframes brand { 0%, 100% { fill: #F8FAFC; } 50% { fill: #34EACB; } } @keyframes caret { 0%, 48% { opacity: .15; } 49%, 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .wave-flow, .rail, .scan, .dot, .brand, .caret { animation: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="158" rx="18" fill="#0D1117" /><rect width="1200" height="158" rx="18" fill="url(#grid)" /><rect class="scan" width="190" height="158" fill="url(#scan)" />
  <path d="M0 18C190 66 330 0 544 27C773 56 942 7 1200 34V0H0Z" fill="url(#wave)" opacity="0.2" filter="url(#softGlow)" />
  <path class="wave-flow" d="M0 12C190 54 340 4 548 29C770 56 958 11 1200 36" fill="none" stroke="url(#wave)" stroke-width="3" stroke-dasharray="30 10 5 10" />
  <path class="rail" d="M250 85H476M724 85H950" fill="none" stroke="url(#wave)" stroke-width="1.5" stroke-dasharray="4 10" />
  <path d="M28 55V33H50M1150 33H1172V55M28 124V146H50M1150 146H1172V124" fill="none" stroke="#34EACB" stroke-opacity=".65" stroke-width="1.5" />
  <text class="brand" x="600" y="76" text-anchor="middle" fill="#F8FAFC" font-family="JetBrains Mono, Consolas, monospace" font-size="24" font-weight="700" letter-spacing="5">MIEOW</text>
  <text x="600" y="106" text-anchor="middle" fill="#F8FAFC" fill-opacity="0.76" font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="2.5">BUILD  ·  LEARN  ·  SHIP</text>
  <text x="600" y="132" text-anchor="middle" fill="#34EACB" fill-opacity=".72" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="2">SYSTEM READY<tspan class="caret">_</tspan></text>
  <circle class="dot" cx="234" cy="85" r="4" fill="#EF4444" filter="url(#softGlow)" /><circle class="dot alt" cx="966" cy="85" r="4" fill="#34EACB" filter="url(#softGlow)" />
</svg>
