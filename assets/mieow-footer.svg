<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Mieow profile footer</title>
  <desc id="desc">A black footer with red, hot-pink, teal, and restrained violet accents.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF4444" />
      <stop offset="0.55" stop-color="#FF0066" />
      <stop offset="0.9" stop-color="#FF0066" />
      <stop offset="0.96" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#34EACB" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>
  <rect width="1200" height="150" fill="#0D1117" />
