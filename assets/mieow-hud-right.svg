<svg xmlns="http://www.w3.org/2000/svg" width="360" height="288" viewBox="0 0 360 288" role="img" aria-labelledby="title desc">
  <title id="title">Focus HUD</title>
  <desc id="desc">A red and pink cyber HUD showing a focus on AI and commerce.</desc>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF0066" />
      <stop offset="0.65" stop-color="#EF4444" />
      <stop offset="1" stop-color="#EF4444" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="panel" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117" stop-opacity="0.68" />
      <stop offset="1" stop-color="#180A11" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
    <style>
      .flow { animation: flow 4s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite .35s; }
      .scan { animation: scan 3.2s ease-in-out infinite .45s; }
      @keyframes flow { to { stroke-dashoffset: 72; } }
      @keyframes pulse { 0%, 100% { opacity: .38; } 50% { opacity: 1; } }
      @keyframes scan { 0%, 100% { transform: translateX(92px); opacity: .25; } 50% { transform: translateX(0); opacity: .8; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse, .scan { animation: none; }
      }
    </style>
  </defs>

  <path d="M6 144H352" stroke="url(#rail)" stroke-width="5" opacity="0.17" filter="url(#glow)" />
  <path class="flow" d="M6 144H352" stroke="url(#rail)" stroke-width="1.5" stroke-dasharray="8 10" />

  <path d="M78 116L116 78H335L351 95V201L335 217H107L78 188Z" fill="url(#panel)" stroke="#EF4444" stroke-opacity="0.8" stroke-width="1.5" />
  <path d="M210 78H335" stroke="#FF0066" stroke-width="4" />
  <path d="M78 172V188L107 217H123M319 78H335L351 95V111" fill="none" stroke="#34EACB" stroke-width="2" />
  <path d="M135 197H326" stroke="#8B5CF6" stroke-opacity="0.42" stroke-width="1" />
  <rect class="scan" x="135" y="196" width="58" height="2" rx="1" fill="#FF0066" />

  <text x="105" y="120" fill="#F8FAFC" font-family="JetBrains Mono, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="3">FOCUS</text>
  <text x="105" y="158" fill="#FF0066" font-family="JetBrains Mono, Consolas, monospace" font-size="23" font-weight="800" letter-spacing="1">AI + COMMERCE</text>
  <text x="105" y="184" fill="#94A3B8" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5">SYSTEM ONLINE // 07</text>

  <circle class="pulse" cx="54" cy="144" r="7" fill="#34EACB" filter="url(#glow)" />
  <circle cx="54" cy="144" r="3.5" fill="#34EACB" />
  <path d="M41 135L32 144L41 153" fill="none" stroke="#FF0066" stroke-width="2" />
  <path d="M23 137V151" stroke="#F8FAFC" stroke-opacity="0.68" />
</svg>
