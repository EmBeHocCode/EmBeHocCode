<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="title desc">
  <title id="title">GITHUB PULSE</title>
  <desc id="desc">Animated Mieow cyber typography section heading.</desc>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EF4444"/><stop offset=".58" stop-color="#FF0066"/><stop offset=".86" stop-color="#8B5CF6"/><stop offset="1" stop-color="#34EACB"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34EACB" stop-opacity="0"/><stop offset=".5" stop-color="#34EACB" stop-opacity=".7"/><stop offset="1" stop-color="#34EACB" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-60%" y="-150%" width="220%" height="400%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .flow { animation: flow 3s linear infinite; }.scanner { animation: scanner 4.8s ease-in-out infinite; }.status { animation: blink 1.8s steps(2,end) infinite; }.heading { animation: breathe 3.6s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -72; } } @keyframes scanner { 0%,10% { transform:translateX(-180px);opacity:0 } 24%,74% { opacity:1 } 90%,100% { transform:translateX(1320px);opacity:0 } } @keyframes blink { 0%,44% { opacity:.25 } 45%,100% { opacity:1 } } @keyframes breathe { 0%,100% { opacity:.92 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) { .flow,.scanner,.status,.heading { animation:none!important } }
    </style>
  </defs>
  <path d="M28 11H1172L1188 27V62H12V27Z" fill="#0D1117" fill-opacity=".44" stroke="#26313D" stroke-width="1"/>
  <path d="M28 11H196" stroke="#EF4444" stroke-width="2"/><path d="M1004 11H1172L1188 27" fill="none" stroke="#34EACB" stroke-width="2"/>
  <path d="M24 64H1176" stroke="url(#rail)" stroke-width="1.5" opacity=".7"/>
  <path class="flow" d="M24 69H430M770 69H1176" stroke="#34EACB" stroke-width="1.5" stroke-dasharray="3 12" opacity=".58"/>
  <rect class="scanner" x="0" y="11" width="150" height="51" fill="url(#scan)" opacity=".18"/>
  <path d="M30 20H82L92 30V54H30Z" fill="#151B25" stroke="#FF0066" stroke-width="1.5"/>
  <text x="60" y="45" text-anchor="middle" fill="#34EACB" font-family="Consolas, 'Cascadia Mono', monospace" font-size="18" font-weight="700" letter-spacing="2">04</text>
  <text class="heading" x="116" y="47" fill="#F8FAFC" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="1.8">GITHUB PULSE</text>
  <circle class="status" cx="1000" cy="37" r="4" fill="#34EACB" filter="url(#glow)"/>
  <text x="1160" y="42" text-anchor="end" fill="#94A3B8" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" letter-spacing="2">LIVE TELEMETRY // ONLINE</text>
