<svg xmlns="http://www.w3.org/2000/svg" width="520" height="64" viewBox="0 0 520 64" role="img" aria-label="Explore all public repositories">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EF4444"/><stop offset=".56" stop-color="#FF0066"/><stop offset=".86" stop-color="#8B5CF6"/><stop offset="1" stop-color="#34EACB"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34EACB" stop-opacity="0"/><stop offset=".5" stop-color="#34EACB" stop-opacity=".22"/><stop offset="1" stop-color="#34EACB" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-120%" width="160%" height="340%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><path d="M18 2H502L518 18V46L502 62H18L2 46V18Z"/></clipPath>
    <style>
      .outline { animation: outline 2.8s ease-in-out infinite; }.scan { animation: scan 3.8s ease-in-out infinite; }.chevron { animation: chevron 1.4s ease-in-out infinite; }.chevron.two { animation-delay: -.35s; }.chevron.three { animation-delay: -.7s; }.dot { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes outline { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
      @keyframes scan { 0%, 12% { transform: translateX(-130px); opacity: 0; } 25%, 70% { opacity: 1; } 88%, 100% { transform: translateX(650px); opacity: 0; } }
      @keyframes chevron { 0%, 100% { transform: translateX(0); opacity: .28; } 50% { transform: translateX(4px); opacity: 1; } } @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .outline, .scan, .chevron, .dot { animation: none !important; } }
    </style>
  </defs>
  <path d="M18 2H502L518 18V46L502 62H18L2 46V18Z" fill="#0D1117" stroke="#EF4444" stroke-opacity=".35"/>
  <g clip-path="url(#clip)"><rect class="scan" width="120" height="64" fill="url(#scan)"/></g>
  <path class="outline" d="M18 2H502L518 18V46L502 62H18L2 46V18Z" fill="none" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>
  <circle class="dot" cx="30" cy="32" r="3.5" fill="#34EACB" filter="url(#glow)"/>
  <text x="258" y="38" text-anchor="middle" fill="#F8FAFC" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.6">EXPLORE ALL PUBLIC REPOSITORIES</text>
  <g fill="none" stroke="#FF0066" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path class="chevron" d="M455 25L462 32L455 39"/><path class="chevron two" d="M465 25L472 32L465 39"/><path class="chevron three" d="M475 25L482 32L475 39"/></g>
</svg>
