name: Switch Profile Theme

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Complete profile design to activate
        required: true
        default: cyber-hud
        type: choice
        options:
          - cyber-hud
          - neon-sakura
          - minimal-terminal
          - hologram-ocean

permissions:
  contents: write

concurrency:
  group: profile-theme-switch
  cancel-in-progress: false

jobs:
  switch-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Activate selected profile theme
        run: python scripts/switch_profile_theme.py "${{ inputs.theme }}"

      - name: Commit active theme
        env:
          THEME: ${{ inputs.theme }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .profile-theme
          if git diff --cached --quiet; then
            echo "Theme '$THEME' is already active."
          else
            git commit -m "theme: switch profile to $THEME"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
